<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><style>
@import url('https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=Unbounded:wght@500;600&display=swap');
*{box-sizing:border-box}body{margin:0;background:#d8d0c2;font-family:'Golos Text',sans-serif;padding:40px}
.wrap{width:520px;margin:0 auto;background:#f7f3ec;border:1px solid #e1dacd;border-radius:24px;padding:22px}
.card{background:#fffdf9;border:1px solid #e1dacd;border-radius:20px;padding:22px;box-shadow:0 14px 34px rgba(53,47,35,.08)}
.kicker{font-size:10px;letter-spacing:1.2px;text-transform:uppercase;color:#718077;font-weight:700;margin:0 0 8px}
h2{font-family:'Unbounded',sans-serif;font-size:22px;letter-spacing:-.7px;margin:0 0 6px;color:#1d2a23}
p{font-size:12px;line-height:1.55;color:#718077;margin:0 0 18px}
.btn{display:flex;align-items:center;justify-content:space-between;gap:12px;background:#1d2a23;color:#fff;text-decoration:none;border-radius:14px;padding:14px 16px;font-size:13px;font-weight:700}
.btn-left{display:flex;align-items:center;gap:10px}.badge{width:28px;height:28px;border-radius:50%;background:#e60023;display:grid;place-items:center;font-family:Georgia,serif;font-weight:700;font-size:18px;color:#fff}
.arrow{font-size:18px;color:#c9f56a}.hint{font-size:10.5px;color:#8b978f;margin:10px 0 0;text-align:center}
</style></head><body><div class="wrap"><div class="card"><p class="kicker">Видео</p><h2>Посмотреть приготовление</h2><p>Найдите видео этого блюда в Pinterest — откроется поиск по названию.</p><a class="btn" href="#"><span class="btn-left"><span class="badge">P</span>Смотреть в Pinterest</span><span class="arrow">→</span></a><p class="hint">Откроется Pinterest в браузере</p></div></div></body></html>
